<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Notlar · üç tema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Unbounded:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width:1330px;height:924px;box-sizing:border-box;padding:40px;background:#2A2A30;display:flex;gap:40px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="3">
  <div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;padding:40px 24px 0;display:flex;flex-direction:column;gap:12px;{{th.phoneS}}">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
      <h1 style="margin:0;font-size:40px;line-height:1;{{th.h1}}">Notlar</h1>
      <button aria-label="Ayarlar" style="width:42px;height:42px;padding:0;font-size:15px;font-weight:700;{{th.avS}}">S</button>
    </div>

    <div style="display:flex;gap:6px;flex:none">
      <button style="height:36px;padding:0 11px;font-size:13px;font-weight:700;{{th.chipOn}}">Hepsi</button>
      <button style="height:36px;padding:0 11px;font-size:13px;font-weight:700;{{th.chipOff}}">Ev</button>
      <button style="height:36px;padding:0 11px;font-size:13px;font-weight:700;{{th.chipOff}}">Market</button>
      <button style="height:36px;padding:0 11px;font-size:13px;font-weight:700;{{th.chipOff}}">Aslan</button>
      <button style="height:36px;padding:0 11px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;{{th.chipOff}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>Kişisel</button>
    </div>

    <div style="display:flex;gap:10px;align-items:flex-start;flex:none">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{th.left}}" as="n" hint-placeholder-count="2">
          <div style="box-sizing:border-box;padding:14px;min-height:{{n.h}}px;{{n.s}}">
            <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:0.6px;{{n.tag}}">
              <sc-if value="{{n.lock}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></sc-if>{{n.cat}}
            </div>
            <div style="margin-top:8px;display:flex;flex-direction:column;gap:7px">
              <sc-for list="{{n.lines}}" as="l" hint-placeholder-count="3">
                <div style="display:flex;align-items:flex-start;gap:8px;font-size:15px;font-weight:600;line-height:1.25;opacity:{{l.op}}">
                  <sc-if value="{{n.check}}" hint-placeholder-val="{{false}}"><span style="width:15px;height:15px;margin-top:1px;box-sizing:border-box;flex:none;border:2px solid currentColor;border-radius:{{th.bx}}px;{{l.fill}}"></span></sc-if>
                  <span style="{{l.dec}}">{{l.t}}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{th.right}}" as="n" hint-placeholder-count="2">
          <div style="box-sizing:border-box;padding:14px;min-height:{{n.h}}px;{{n.s}}">
            <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:0.6px;{{n.tag}}">
              <sc-if value="{{n.lock}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></sc-if>{{n.cat}}
            </div>
            <div style="margin-top:8px;display:flex;flex-direction:column;gap:7px">
              <sc-for list="{{n.lines}}" as="l" hint-placeholder-count="3">
                <div style="display:flex;align-items:flex-start;gap:8px;font-size:15px;font-weight:600;line-height:1.25;opacity:{{l.op}}">
                  <sc-if value="{{n.check}}" hint-placeholder-val="{{false}}"><span style="width:15px;height:15px;margin-top:1px;box-sizing:border-box;flex:none;border:2px solid currentColor;border-radius:{{th.bx}}px;{{l.fill}}"></span></sc-if>
                  <span style="{{l.dec}}">{{l.t}}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <button style="position:absolute;right:24px;bottom:100px;height:52px;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;{{th.ctaS}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Not ekle</button>

    <nav aria-label="Ana menü" style="position:absolute;left:40px;right:40px;bottom:20px;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;{{th.navS}}">
      <button aria-label="Bugün" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb0}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      <button aria-label="Takvim" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb1}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
      <button aria-label="Notlar" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb2}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h9l4 4v12H6z"/><path d="M9 12h7M9 16h5"/></svg></button>
      <button aria-label="Ortak" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb3}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></button>
      <button aria-label="Kişisel" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb4}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
    </nav>
  </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":924}}'>
class Component extends DCLogic {
  core(active) {
    const D = [
      { key: 'mozaik', font: "'Bricolage Grotesque',sans-serif", hf: "'Bricolage Grotesque',sans-serif", hs: 'font-weight:800;letter-spacing:-1.5px;',
        bg: '#E8ECF3', card: '#FFFFFF', cb: '0', r: 28, rn: 24, pr: 48, pb: '', text: '#121212', muted: '#4A5568', bx: 5,
        av: 'background:#121212;color:#FFD43B;border:0;', avR: 21, navBg: 'background:#121212;border:0;border-radius:32px;', ni: '#D5DAE6', non: 'background:#FFD43B;color:#121212;', nr: 23,
        cta: 'background:#121212;color:#FFD43B;border:0;', ctaR: 26, chipR: 18,
        on: 'background:#121212;color:#FFFFFF;border:0;', off: 'background:#FFFFFF;color:#121212;border:0;',
        notes: [['#FFD43B', '#121212', '#121212'], ['#5EEAD4', '#121212', '#121212'], ['#FF9EC0', '#121212', '#121212'], ['#2F4BFF', '#FFFFFF', '#FFFFFF']], nb: '0' },
      { key: 'yorunge', font: "'Manrope',sans-serif", hf: "'Unbounded',sans-serif", hs: 'font-weight:600;letter-spacing:-0.5px;',
        bg: '#0B0F1A', card: '#151B2B', cb: '0', r: 24, rn: 20, pr: 48, pb: 'border:1px solid #263050;', text: '#EEF1FA', muted: '#9AA3BD', bx: 8,
        av: 'background:#C6F432;color:#0B0F1A;border:0;', avR: 21, navBg: 'background:#151B2B;border:1px solid #263050;border-radius:32px;', ni: '#9AA3BD', non: 'background:#C6F432;color:#0B0F1A;', nr: 23,
        cta: 'background:#C6F432;color:#0B0F1A;border:0;', ctaR: 26, chipR: 18,
        on: 'background:#EEF1FA;color:#0B0F1A;border:0;', off: 'background:#151B2B;color:#EEF1FA;border:0;',
        notes: [['#151B2B', '#EEF1FA', '#C6F432'], ['#151B2B', '#EEF1FA', '#7CC8FF'], ['#151B2B', '#EEF1FA', '#FF7A66'], ['#151B2B', '#EEF1FA', '#B79CFF']], nb: '0' },
      { key: 'teknik', font: "'Archivo',sans-serif", hf: "'Archivo',sans-serif", hs: 'font-weight:800;letter-spacing:-1.5px;text-transform:uppercase;',
        bg: '#FAFAFA', card: '#FFFFFF', cb: '2px solid #0A0A0A', r: 0, rn: 0, pr: 44, pb: '', text: '#0A0A0A', muted: '#5C5C5C', bx: 0,
        av: 'background:#0A0A0A;color:#FAFAFA;border:0;', avR: 0, navBg: 'background:#FAFAFA;border:2px solid #0A0A0A;border-radius:0;', ni: '#0A0A0A', non: 'background:#FF4F00;color:#0A0A0A;', nr: 0,
        cta: 'background:#FF4F00;color:#0A0A0A;border:2px solid #0A0A0A;', ctaR: 0, chipR: 0,
        on: 'background:#0A0A0A;color:#FAFAFA;border:2px solid #0A0A0A;', off: 'background:transparent;color:#0A0A0A;border:2px solid #0A0A0A;',
        notes: [['#FFFFFF', '#0A0A0A', '#5C5C5C'], ['#FFFFFF', '#0A0A0A', '#5C5C5C'], ['#FFFFFF', '#0A0A0A', '#5C5C5C'], ['#FF4F00', '#0A0A0A', '#0A0A0A']], nb: '2px solid #0A0A0A' }
    ];
    return D.map((d) => {
      const o = {
        key: d.key, muted: d.muted, bx: d.bx,
        phoneS: 'background:' + d.bg + ';color:' + d.text + ';font-family:' + d.font + ';border-radius:' + d.pr + 'px;' + d.pb,
        h1: 'font-family:' + d.hf + ';' + d.hs,
        avS: d.av + 'border-radius:' + d.avR + 'px;',
        navS: d.navBg,
        ctaS: d.cta + 'border-radius:' + d.ctaR + 'px;',
        chipOn: d.on + 'border-radius:' + d.chipR + 'px;',
        chipOff: d.off + 'border-radius:' + d.chipR + 'px;',
        d
      };
      for (let i = 0; i < 5; i++) o['nb' + i] = 'border-radius:' + d.nr + 'px;' + (i === active ? d.non : 'background:transparent;color:' + d.ni + ';');
      return o;
    });
  }
  renderVals() {
    const mk = (th, i, cat, h, lock, check, lines) => {
      const c = th.d.notes[i];
      return {
        cat, h, lock, check,
        s: 'background:' + c[0] + ';color:' + c[1] + ';border:' + th.d.nb + ';border-radius:' + th.d.rn + 'px;',
        tag: 'color:' + c[2] + ';',
        lines: lines.map((l) => ({
          t: l[0], op: l[1] ? '0.6' : '1', dec: l[1] ? 'text-decoration:line-through;' : '',
          fill: l[1] ? 'background:currentColor;' : ''
        }))
      };
    };
    const themes = this.core(2).map((th) => ({
      ...th,
      left: [
        mk(th, 0, 'MARKET', 220, false, true, [['Süt', false], ['Yumurta', true], ['Domates', false], ['Zeytinyağı', false], ['Limon', false]]),
        mk(th, 2, 'ASLAN', 120, false, false, [['6. ay bedenlerine bak, mama sandalyesi araştır', false]])
      ],
      right: [
        mk(th, 1, 'EV', 150, false, false, [['Banyo lambasını değiştir', false], ['Kombi bakımı için usta ara', false]]),
        mk(th, 3, 'KİŞİSEL', 190, true, false, [['Okunacaklar: üç kitap seç', false], ['Yeni sabah rutini denemesi', false]])
      ]
    }));
    return { themes };
  }
}
</script>
</body>
</html>

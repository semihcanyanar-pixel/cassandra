<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bugün · ilaç kartı · üç tema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Unbounded:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width:1330px;height:924px;box-sizing:border-box;padding:40px;background:#2A2A30;display:flex;gap:40px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="3">
  <div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;padding:40px 24px 0;display:flex;flex-direction:column;gap:10px;{{th.phoneS}}">

    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:14px;font-weight:500;color:{{th.muted}}">Çarşamba, 4 Kasım</div>
        <h1 style="margin:2px 0 0;font-size:30px;line-height:1.05;{{th.h1}}">Bugün</h1>
      </div>
      <button aria-label="Ayarlar" style="width:42px;height:42px;padding:0;font-size:15px;font-weight:700;{{th.avS}}">S</button>
    </div>

    <div style="flex:none;box-sizing:border-box;padding:16px 18px 18px;{{th.heroS}}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;font-weight:700;letter-spacing:0.6px;{{th.heroMuted}}">SIRADAKİ İLAÇ</span>
        <span style="height:20px;padding:0 8px;display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:0.3px;{{th.mealS}}">TOK KARNINA</span>
      </div>
      <div style="margin-top:6px;font-size:64px;line-height:1;{{th.bigNum}}">20:00</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <span style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;{{th.heroAv}}">S</span>
        <div style="flex:1"><div style="font-size:18px;font-weight:800">Antibiyotik</div><div style="font-size:13px;font-weight:600;{{th.heroMuted}}">Ben · 1 tablet</div></div>
        <button style="height:46px;padding:0 22px;font-size:15px;font-weight:700;{{th.heroBtn}}">Aldım</button>
      </div>
    </div>

    <div style="flex:none;box-sizing:border-box;padding:14px 16px 6px;{{th.cardS}}">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px;font-weight:700;color:{{th.muted}};letter-spacing:0.6px">BUGÜNKÜ DOZLAR</span>
        <span style="font-size:13px;font-weight:700">4/5</span>
      </div>
      <sc-for list="{{th.rows}}" as="d" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:10px;height:46px;border-top:1px solid {{th.line}};margin-top:6px">
          <span style="width:42px;font-size:14px;font-weight:700">{{d.t}}</span>
          <span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;{{d.av}}">{{d.l}}</span>
          <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700">{{d.name}}</div><div style="font-size:12px;font-weight:600;color:{{th.muted}}">verildi · {{d.by}}</div></div>
          <span aria-label="Verildi" style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex:none;{{th.checkS}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        </div>
      </sc-for>
    </div>

    <div style="flex:none;box-sizing:border-box;padding:14px 16px 4px;{{th.cardS}}">
      <div style="font-size:12px;font-weight:700;color:{{th.muted}};letter-spacing:0.6px">YAKLAŞAN</div>
      <div style="display:flex;align-items:center;gap:12px;height:42px;margin-top:4px;border-top:1px solid {{th.line}}">
        <span style="width:46px;font-size:13px;font-weight:700">6 Kas</span>
        <span style="flex:1;font-size:15px;font-weight:700">Hastane randevusu</span>
        <span style="font-size:12px;font-weight:700;color:{{th.muted}}">10:30</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;height:42px;border-top:1px solid {{th.line}}">
        <span style="width:46px;font-size:13px;font-weight:700">22 Kas</span>
        <span style="flex:1;font-size:15px;font-weight:700">Berber</span>
        <span style="height:22px;padding:0 8px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;{{th.perTag}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>Kişisel</span>
      </div>
    </div>

    <nav aria-label="Ana menü" style="position:absolute;left:40px;right:40px;bottom:20px;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;{{th.navS}}">
      <button aria-label="Bugün" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb0}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      <button aria-label="Takvim" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb1}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
      <button aria-label="Notlar" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb2}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h9l4 4v12H6z"/><path d="M9 12h7M9 16h5"/></svg></button>
      <button aria-label="Ortak" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb3}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></button>
      <button aria-label="Kişisel" style="width:46px;height:46px;border:0;padding:0;display:flex;align-items:center;justify-content:center;{{th.nb4}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
    </nav>
  </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":924}}'>
class Component extends DCLogic {
  core(active) {
    const D = [
      { key: 'mozaik', font: "'Bricolage Grotesque',sans-serif", hf: "'Bricolage Grotesque',sans-serif", hs: 'font-weight:800;letter-spacing:-1.2px;',
        bg: '#E8ECF3', card: '#FFFFFF', cb: '0', r: 28, pr: 48, pb: '', text: '#121212', muted: '#4A5568', line: '#E3E7EF',
        av: { S: ['#2F4BFF', '#FFFFFF', '0'], E: ['#FF9EC0', '#121212', '0'], A: ['#FFD43B', '#121212', '0'] }, avR: 14,
        avBtn: 'background:#121212;color:#FFD43B;border:0;border-radius:21px;', per: ['#2F4BFF', '#FFFFFF', 11],
        navBg: 'background:#121212;border:0;border-radius:32px;', ni: '#D5DAE6', non: 'background:#FFD43B;color:#121212;', nr: 23,
        check: 'background:#121212;color:#FFD43B;border-radius:12px;',
        hero: 'background:#FFD43B;color:#121212;border:0;border-radius:28px;', heroMuted: 'color:#3B3B2A;', big: 'font-weight:800;letter-spacing:-3px;', heroAv: 'background:#2F4BFF;color:#FFFFFF;border-radius:15px;border:0;', heroBtn: 'background:#121212;color:#FFD43B;border:0;border-radius:23px;', mealTag: 'background:#121212;color:#FFFFFF;border-radius:10px;' },
      { key: 'yorunge', font: "'Manrope',sans-serif", hf: "'Unbounded',sans-serif", hs: 'font-weight:600;letter-spacing:-0.5px;',
        bg: '#0B0F1A', card: '#151B2B', cb: '0', r: 24, pr: 48, pb: 'border:1px solid #263050;', text: '#EEF1FA', muted: '#9AA3BD', line: '#263050',
        av: { S: ['#C6F432', '#0B0F1A', '0'], E: ['#FF7A66', '#0B0F1A', '0'], A: ['#7CC8FF', '#0B0F1A', '0'] }, avR: 14,
        avBtn: 'background:#C6F432;color:#0B0F1A;border:0;border-radius:21px;', per: ['#B79CFF', '#0B0F1A', 11],
        navBg: 'background:#151B2B;border:1px solid #263050;border-radius:32px;', ni: '#9AA3BD', non: 'background:#C6F432;color:#0B0F1A;', nr: 23,
        check: 'background:#C6F432;color:#0B0F1A;border-radius:12px;',
        hero: 'background:#151B2B;color:#EEF1FA;border:2px solid #C6F432;border-radius:24px;', heroMuted: 'color:#9AA3BD;', big: "font-family:'Unbounded',sans-serif;font-weight:600;letter-spacing:-2px;color:#C6F432;", heroAv: 'background:#C6F432;color:#0B0F1A;border-radius:15px;border:0;', heroBtn: 'background:#C6F432;color:#0B0F1A;border:0;border-radius:23px;', mealTag: 'background:#EEF1FA;color:#0B0F1A;border-radius:10px;' },
      { key: 'teknik', font: "'Archivo',sans-serif", hf: "'Archivo',sans-serif", hs: 'font-weight:800;letter-spacing:-1.2px;text-transform:uppercase;',
        bg: '#FAFAFA', card: '#FFFFFF', cb: '2px solid #0A0A0A', r: 0, pr: 44, pb: '', text: '#0A0A0A', muted: '#5C5C5C', line: '#C9C9C9',
        av: { S: ['#0A0A0A', '#FAFAFA', '0'], E: ['#FF4F00', '#0A0A0A', '1.5px solid #0A0A0A'], A: ['#E4E4E4', '#0A0A0A', '1.5px solid #0A0A0A'] }, avR: 0,
        avBtn: 'background:#0A0A0A;color:#FAFAFA;border:0;border-radius:0;', per: ['#FF4F00', '#0A0A0A', 0],
        navBg: 'background:#FAFAFA;border:2px solid #0A0A0A;border-radius:0;', ni: '#0A0A0A', non: 'background:#FF4F00;color:#0A0A0A;', nr: 0,
        check: 'background:#0A0A0A;color:#FAFAFA;border-radius:0;',
        hero: 'background:#FF4F00;color:#0A0A0A;border:2px solid #0A0A0A;border-radius:0;', heroMuted: 'color:#0A0A0A;', big: 'font-weight:800;letter-spacing:-4px;', heroAv: 'background:#0A0A0A;color:#FAFAFA;border-radius:0;border:0;', heroBtn: 'background:#0A0A0A;color:#FAFAFA;border:0;border-radius:0;', mealTag: 'background:#0A0A0A;color:#FAFAFA;border-radius:0;' }
    ];
    return D.map((d) => {
      const o = {
        d, key: d.key, muted: d.muted, line: d.line,
        phoneS: 'background:' + d.bg + ';color:' + d.text + ';font-family:' + d.font + ';border-radius:' + d.pr + 'px;' + d.pb,
        h1: 'font-family:' + d.hf + ';' + d.hs,
        cardS: 'background:' + d.card + ';border:' + d.cb + ';border-radius:' + d.r + 'px;',
        avS: d.avBtn,
        navS: d.navBg, checkS: d.check,
        perTag: 'background:' + d.per[0] + ';color:' + d.per[1] + ';border-radius:' + d.per[2] + 'px;',
        heroS: d.hero, heroMuted: d.heroMuted, bigNum: d.big, heroAv: d.heroAv, heroBtn: d.heroBtn, mealS: d.mealTag
      };
      for (let i = 0; i < 5; i++) o['nb' + i] = 'border-radius:' + d.nr + 'px;' + (i === active ? d.non : 'background:transparent;color:' + d.ni + ';');
      return o;
    });
  }
  renderVals() {
    const done = [
      { t: '07:30', who: 'E', name: 'Eşi · Mide koruyucu', by: 'Eşi 07:35' },
      { t: '08:00', who: 'S', name: 'Ben · Antibiyotik', by: 'Ben 08:04' },
      { t: '09:00', who: 'A', name: 'Aslan · D vitamini', by: 'Eşi 09:10' },
      { t: '14:00', who: 'S', name: 'Ben · Antibiyotik', by: 'Ben 14:12' }
    ];
    const themes = this.core(0).map((th) => {
      const avS = (w) => { const a = th.d.av[w]; return 'background:' + a[0] + ';color:' + a[1] + ';border:' + a[2] + ';border-radius:' + th.d.avR + 'px;'; };
      return { ...th, rows: done.map((x) => ({ t: x.t, l: x.who, name: x.name, by: x.by, av: avS(x.who) })) };
    });
    return { themes };
  }
}
</script>
</body>
</html>
